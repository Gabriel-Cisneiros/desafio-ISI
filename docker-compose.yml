name: passe

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passe
      POSTGRES_PASSWORD: passe
      POSTGRES_DB: passe
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passe -d passe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [full]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://passe:passe@db:5432/passe
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [full]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  db_data:
